name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"        # weekly: new CVEs are published without any commit

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          # Repository secret CODECOV_TOKEN authenticates the upload (Settings > Secrets and variables
          # > Actions). Fork PRs never receive repository secrets; Codecov accepts tokenless uploads
          # from forks of a public repository. Dependabot PRs read a separate secret store: add the
          # token with `gh secret set CODECOV_TOKEN --app dependabot` if their uploads should
          # succeed. A failed upload does not fail the job (fail_ci_if_error: false). Thresholds:
          # codecov.yml.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docstring-coverage:
    # Every module, class, function and method in src/judge_kappa must have a docstring, private,
    # dunder and nested ones included (interrogate, fail-under = 100 in pyproject.toml). The ruff
    # D1 rules in the lint step only cover public names and report no coverage figure.
    if: github.event_name != 'schedule'
    name: Docstring coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Docstring coverage (interrogate)
        run: uv run interrogate src/judge_kappa

  validate-configs:
    if: github.event_name != 'schedule'
    name: Validate example configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install package
        run: uv sync --locked

      - name: Validate all example configs
        run: |
          for f in examples/config_*.yaml; do
            echo "Validating $f..."
            uv run judge-kappa validate "$f" || exit 1
          done

  build:
    if: github.event_name != 'schedule'
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build wheel and sdist
        run: uv build

      - name: Check dist contents
        run: ls -lh dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  audit:
    # pip-audit (PyPA, open source) checks the locked dependency set, dev tools included,
    # against the PyPI/OSV advisory database. Runs on PRs, pushes and weekly.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"

      - name: Audit the locked dependencies for known vulnerabilities
        # Exports every locked package (all extras, dev group) and fails on any known advisory.
        run: |
          uv export --locked --all-extras --all-groups --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off
