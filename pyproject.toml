[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judge-kappa"
version = "0.3.2"
description = "Unified LLM evaluation: A/B uplift, Panel/Jury judges, Krippendorff α, Cohen κ, pairwise preference, Elo tournament, and bias detection"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "William Caban", email = "william.caban@gmail.com" },
]
keywords = [
    "llm", "evaluation", "llm-evaluation", "ai-evaluation",
    "inter-rater-agreement", "krippendorff", "cohen-kappa",
    "pairwise", "elo", "tournament", "judge", "rubric",
    "bias-detection", "positional-bias", "verbosity-bias",
    "agent-skills-eval", "mlflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "krippendorff>=0.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage      = "https://github.com/williamcaban/judge-kappa-eval"
Repository    = "https://github.com/williamcaban/judge-kappa-eval"
Documentation = "https://github.com/williamcaban/judge-kappa-eval/tree/main/docs"
Issues        = "https://github.com/williamcaban/judge-kappa-eval/issues"
Changelog     = "https://github.com/williamcaban/judge-kappa-eval/blob/main/CHANGELOG.md"

[project.scripts]
judge-kappa = "judge_kappa.cli.main:app"

[project.optional-dependencies]
openai    = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
tiktoken  = []                             # deprecated no-op, kept so existing install commands still resolve
all       = ["judge-kappa[openai,anthropic]"]

# uv-native dev dependencies (uv sync --group dev)
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "openai>=1.30",       # stubs for type-checking llm/openai_backend.py
    "anthropic>=0.28",    # stubs for type-checking llm/anthropic_backend.py
    "interrogate>=1.7",   # docstring-coverage gate, configured in [tool.interrogate]
]

[tool.hatch.build.targets.wheel]
packages = ["src/judge_kappa"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "examples/",
    "AGENTS.md",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "--tb=short -q"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# D1 = missing-docstring rules (D100-D107): every public module, class, function and method in
# src/ needs a docstring. Tests and examples are exempt below.
select  = ["E", "F", "I", "UP", "B", "SIM", "D1"]
ignore  = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**"    = ["D"]
"examples/**" = ["D"]

# Docstring coverage gate: `uv run interrogate src/judge_kappa`. Run by the required
# "Docstring coverage" CI job and by .pre-commit-config.yaml. ruff D1 (above) only covers public
# names and reports no figure; this counts every module, class, function and method, private,
# dunder and nested included, and fails below 100%.
[tool.interrogate]
fail-under = 100
verbose = 1
ignore-module = false
ignore-init-module = false
ignore-init-method = false
ignore-magic = false
ignore-private = false
ignore-semiprivate = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-property-decorators = false

[tool.mypy]
strict              = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/judge_kappa"]
omit   = [
    "src/judge_kappa/llm/openai_backend.py",
    "src/judge_kappa/llm/anthropic_backend.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under   = 70
