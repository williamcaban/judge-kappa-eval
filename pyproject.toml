[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judge-kappa"
version = "0.2.1"
description = "Unified LLM evaluation: A/B uplift, Panel/Jury judges, Krippendorff α, Cohen κ, pairwise preference, Elo tournament, and bias detection"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "William Caban", email = "william.caban@gmail.com" },
]
keywords = [
    "llm", "evaluation", "llm-evaluation", "ai-evaluation",
    "inter-rater-agreement", "krippendorff", "cohen-kappa",
    "pairwise", "elo", "tournament", "judge", "rubric",
    "bias-detection", "positional-bias", "verbosity-bias",
    "agent-skills-eval", "mlflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "krippendorff>=0.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage      = "https://github.com/williamcaban/judge-kappa-eval"
Repository    = "https://github.com/williamcaban/judge-kappa-eval"
Documentation = "https://github.com/williamcaban/judge-kappa-eval/tree/main/docs"
Issues        = "https://github.com/williamcaban/judge-kappa-eval/issues"
Changelog     = "https://github.com/williamcaban/judge-kappa-eval/blob/main/CHANGELOG.md"

[project.scripts]
judge-kappa = "judge_kappa.cli.main:app"

[project.optional-dependencies]
openai    = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
tiktoken  = ["tiktoken>=0.7"]              # accurate token counts for verbosity bias
all       = ["judge-kappa[openai,anthropic,tiktoken]"]

# uv-native dev dependencies (uv sync --group dev)
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "openai>=1.30",       # stubs for type-checking llm/openai_backend.py
    "anthropic>=0.28",    # stubs for type-checking llm/anthropic_backend.py
]

[tool.hatch.build.targets.wheel]
packages = ["src/judge_kappa"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "examples/",
    "AGENTS.md",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "--tb=short -q"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select  = ["E", "F", "I", "UP", "B", "SIM"]
ignore  = ["E501"]

[tool.mypy]
strict              = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/judge_kappa"]
omit   = [
    "src/judge_kappa/llm/openai_backend.py",
    "src/judge_kappa/llm/anthropic_backend.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under   = 70
