# jury-eval config — skill mode (agent-skills-eval compatible)
#
# Run:  jury-eval run config_skill.yaml
#       jury-eval run config_skill.yaml --format json --output report.json
#       jury-eval run config_skill.yaml --format jsonl | mlflow ...
#
# Required env vars:
#   ANTHROPIC_API_KEY
#   OPENAI_API_KEY          (for gpt4 judge and llama judge via OpenAI compat)

mode: skill
skill_dir: ./my-skill             # must contain SKILL.md and evals/evals.json

# ── Generation backend ────────────────────────────────────────────────────────
# Backend used to run the control and treatment variants.
# This is separate from judge backends — judge and generation models can differ.

generation:
  backend:
    provider: anthropic
    model: claude-sonnet-4-6

# ── Control / Treatment variants ──────────────────────────────────────────────
# control:   same model, no skill context injected
# treatment: same model, SKILL.md content auto-injected as skill_context

control:
  name: control
  temperature: 0.0

treatment:
  name: treatment
  temperature: 0.0
  # skill_context is auto-loaded from SKILL.md — no need to specify here

# ── Judge Panel ───────────────────────────────────────────────────────────────
# type: panel  → all judges share the same rubric; Krippendorff's α measures agreement
# type: jury   → judges use different rubrics; α is a diversity diagnostic
#
# strategy options: mean | weighted_mean | majority_vote | median | trimmed_mean

panel:
  type: panel
  strategy: mean
  judges:

    - id: judge-claude
      type: assertion                 # scores each assertion PASS/FAIL
      backend:
        provider: anthropic
        model: claude-sonnet-4-6
      weight: 1.0
      temperature: 0.0
      calibration:                    # ICL anchors for score grounding
        - prompt: "Summarize the key risks in this document."
          output: "The document mentions risk."
          score: 0.2
          rationale: "Too vague — omits specific risks listed in the document."
        - prompt: "Summarize the key risks in this document."
          output: "Three risks: (1) data leakage via misconfigured S3, (2) unpatched CVE-2024-1234, (3) no MFA on admin accounts."
          score: 0.95
          rationale: "Names all three risks with specifics."

    - id: judge-gpt4
      type: assertion
      backend:
        provider: openai
        model: gpt-4o
      weight: 1.0
      temperature: 0.0
      calibration:
        - prompt: "Summarize the key risks in this document."
          output: "The document mentions risk."
          score: 0.2
          rationale: "Too vague — omits specific risks listed in the document."
        - prompt: "Summarize the key risks in this document."
          output: "Three risks: (1) data leakage via misconfigured S3, (2) unpatched CVE-2024-1234, (3) no MFA on admin accounts."
          score: 0.95
          rationale: "Names all three risks with specifics."

    - id: judge-llama
      type: assertion
      backend:
        provider: openai
        model: meta-llama/Meta-Llama-3-70B-Instruct
        base_url: http://localhost:8000/v1  # local vLLM endpoint
      weight: 1.0

# ── Positional bias detection (optional) ─────────────────────────────────────
# Runs A/B swap test per case. Adds 2× judge calls per case.
# Remove this section to skip positional bias detection.

positional_judge:
  id: pairwise-claude
  backend:
    provider: anthropic
    model: claude-sonnet-4-6
  temperature: 0.0

# ── Statistical settings ──────────────────────────────────────────────────────
# scale_type governs the Krippendorff distance function:
#   ordinal  — use for LLM scores bucketed into ranks (default)
#   interval — use when score differences are meaningful (continuous 0.0–1.0)
#   ratio    — use when a true zero and ratios are meaningful
#   nominal  — use for categorical labels (PASS/FAIL classes)

scale_type: ordinal
verbosity_bias_threshold: 0.30       # Spearman ρ > threshold AND p < 0.05 → flag

# ── Output ────────────────────────────────────────────────────────────────────
# format:           text (human readable) | json | jsonl (one case per line)
# file:             write to file instead of stdout
# include_verdicts: include per-judge per-case verdict detail in JSON output

output:
  format: text
  # file: report.json
  include_verdicts: false
